<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=512, height=512">
  <title>Lucid-3D — SkinnedMesh Demo</title>
  <style>
    * { margin: 0; padding: 0; }
    body { background: #000; display: flex; justify-content: center; align-items: center; height: 100vh; }
    canvas { display: block; }
  </style>
</head>
<body>
  <canvas id="canvas" width="512" height="512"></canvas>
  <script type="module">
    import { Scene } from '/src/core/scene.ts';
    import { PerspectiveCamera } from '/src/core/camera.ts';
    import { Geometry } from '/src/renderer/geometry.ts';
    import { Material } from '/src/renderer/material.ts';
    import { SkinnedMesh } from '/src/renderer/skinned-mesh.ts';
    import { Skeleton } from '/src/animation/skeleton.ts';
    import { WebGLRenderer } from '/src/renderer/webgl-renderer.ts';
    import { vec3 } from '/src/math/vec3.ts';

    const canvas = document.getElementById('canvas');

    // 场景
    const scene = new Scene();
    scene.background = vec3(0.15, 0.15, 0.15); // 深灰色背景

    // 四边形网格：下半部分绑定到 bone 0，上半部分绑定到 bone 1
    // 顶点布局（y 轴向上）：
    //   v0(-0.4, -1, 0) — bone 0   v1(0.4, -1, 0) — bone 0
    //   v2(-0.4,  1, 0) — bone 1   v3(0.4,  1, 0) — bone 1
    const positions = new Float32Array([
      -0.4, -1.0, 0,  // v0: 下半部分 - 蓝色
       0.4, -1.0, 0,  // v1
      -0.4,  1.0, 0,  // v2: 上半部分 - 橙色
       0.4,  1.0, 0,  // v3
    ]);

    const colors = new Float32Array([
      0.3, 0.5, 1.0,   // v0: 蓝色
      0.3, 0.5, 1.0,   // v1: 蓝色
      1.0, 0.6, 0.2,   // v2: 橙色
      1.0, 0.6, 0.2,   // v3: 橙色
    ]);

    // joints: 每顶点 4 个骨骼索引（只用第一个）
    const joints = new Float32Array([
      0, 0, 0, 0,  // v0: bone 0
      0, 0, 0, 0,  // v1: bone 0
      1, 0, 0, 0,  // v2: bone 1
      1, 0, 0, 0,  // v3: bone 1
    ]);

    // weights: 每顶点 4 个权重（v0 全部归 bone 0，v2 全部归 bone 1）
    const weights = new Float32Array([
      1, 0, 0, 0,
      1, 0, 0, 0,
      1, 0, 0, 0,
      1, 0, 0, 0,
    ]);

    const indices = new Uint16Array([0, 1, 3,  0, 3, 2]);

    const geometry = new Geometry({ positions, colors, joints, weights, indices });

    // 骨骼：root(0) + upper(1，以 y=0 为轴旋转)
    //   bone 0: root，IBM = 单位矩阵
    //   bone 1: child of 0，IBM = 单位矩阵
    // 在 rest pose 下两块骨骼均在原点，IBM = I
    // bone 1 旋转时会绕原点旋转上半部分的顶点
    function identityMat4() {
      const m = new Float32Array(16);
      m[0] = 1; m[5] = 1; m[10] = 1; m[15] = 1;
      return m;
    }

    const ibm = new Float32Array(32);
    ibm.set(identityMat4(), 0);   // bone 0 IBM
    ibm.set(identityMat4(), 16);  // bone 1 IBM

    const bones = [
      { name: 'root',  parentIndex: -1 },
      { name: 'upper', parentIndex: 0  },
    ];
    const skeleton = new Skeleton(bones, ibm);

    // 将 bone 1 绕 Z 轴向右旋转 45°（顺时针，即 -45°）
    const angle = -Math.PI / 4;
    const halfAngle = angle / 2;
    // bone 1 的局部旋转四元数：绕 Z 轴 -45°
    skeleton.localRotations[4 + 0] = 0;                    // x
    skeleton.localRotations[4 + 1] = 0;                    // y
    skeleton.localRotations[4 + 2] = Math.sin(halfAngle);  // z
    skeleton.localRotations[4 + 3] = Math.cos(halfAngle);  // w

    // 更新骨骼矩阵（world * IBM）
    skeleton.update();

    // 创建 SkinnedMesh
    const material = new Material();
    const skinnedMesh = new SkinnedMesh(geometry, material, skeleton, 'body');
    scene.addChild(skinnedMesh);

    // 正交相机：从 z=5 看向原点，FOV 45°，覆盖 ±1.5 范围
    const camera = new PerspectiveCamera({
      fov: Math.PI / 4,
      aspect: 1,
      near: 0.1,
      far: 100,
    });
    camera.position = vec3(0, 0, 5);
    camera.lookAt(vec3(0, 0, 0));

    // 渲染一帧
    const renderer = new WebGLRenderer(canvas);
    renderer.render(scene, camera);

    // 通知截图工具已就绪
    canvas.dataset.ready = '1';

    console.log('[lucid-3d] SkinnedMesh demo rendered. Ready for screenshot.');
  </script>
</body>
</html>
