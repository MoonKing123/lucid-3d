name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Ensure stubs for pre-written tests
        run: node scripts/ensure-stubs.mjs --fix

      - run: pnpm run test
        name: Run unit tests (vitest)

  visual-tests:
    name: Visual Regression Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Install Chromium for Playwright
        run: npx playwright install chromium

      - name: Run visual tests
        run: |
          npx vite --port 5173 &
          sleep 3
          # First pass: generate baselines for this platform
          node test/visual/flywheel-test.mjs --update
          # Second pass: verify deterministic (same platform, must be 0 diff)
          node test/visual/flywheel-test.mjs

      - name: Upload diff artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: visual-diffs
          path: test/visual/diffs/
