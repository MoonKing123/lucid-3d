<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=512, height=512">
  <title>Lucid-3D — Particle Emitter Demo</title>
  <style>
    * { margin: 0; padding: 0; }
    body { background: #111; display: flex; justify-content: center; align-items: center; height: 100vh; }
    canvas { display: block; }
  </style>
</head>
<body>
  <canvas id="canvas" width="512" height="512"></canvas>
  <script type="module">
    import { ParticleEmitter } from '/src/renderer/particle-emitter.ts';
    import { vec3 } from '/src/math/vec3.ts';

    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');

    // 背景
    ctx.fillStyle = '#111';
    ctx.fillRect(0, 0, 512, 512);

    // 创建粒子发射器：底部中央向上喷射，亮黄色→橙红色
    const emitter = new ParticleEmitter({
      maxParticles: 300,
      emissionRate: 0,      // 仅手动 burst
      lifetime: { min: 1.5, max: 2.5 },
      speed: { min: 120, max: 200 },
      size: { min: 4, max: 8 },
      color: vec3(1.0, 0.95, 0.2),    // 亮黄色
      colorEnd: vec3(1.0, 0.15, 0.0), // 橙红色
      gravity: vec3(0, -180, 0),      // 向下重力（像素/秒²）
      spread: 0.5,                    // 扩散半角约 28.6°
      seed: 42,                       // 固定种子，确保视觉测试确定可复现
    });

    // 发射器放在底部中央（世界坐标，1单位=1像素）
    emitter.position[0] = 0;
    emitter.position[1] = -200;  // 画布中心向下 200px
    emitter.position[2] = 0;

    // 模拟多帧，让粒子处于不同生命阶段
    const dt = 1 / 60;

    // 分批 burst 发射，再推进时间产生喷泉形态
    for (let frame = 0; frame < 150; frame++) {
      if (frame % 3 === 0) {
        emitter.emit(6);   // 每 3 帧发射 6 个粒子
      }
      emitter.update(dt);
    }

    // 获取存活粒子数据
    const count = emitter.activeCount;
    const positions = emitter.getPositions();
    const sizes     = emitter.getSizes();
    const colors    = emitter.getColors();
    const alphas    = emitter.getAlphas();

    // 坐标转换：世界 → 画布（Y 翻转，原点在画布中央）
    const cx = 256, cy = 256;

    for (let i = 0; i < count; i++) {
      const wx = positions[i * 3 + 0];
      const wy = positions[i * 3 + 1];
      // 画布 X = 中心 + worldX，画布 Y = 中心 - worldY（Y 轴翻转）
      const sx = cx + wx;
      const sy = cy - wy;

      const r = Math.round(colors[i * 3 + 0] * 255);
      const g = Math.round(colors[i * 3 + 1] * 255);
      const b = Math.round(colors[i * 3 + 2] * 255);
      const a = alphas[i];
      const radius = sizes[i] * 0.5;

      // 绘制粒子：带径向渐变的发光小球
      const grad = ctx.createRadialGradient(sx, sy, 0, sx, sy, radius * 2);
      grad.addColorStop(0, `rgba(${r},${g},${b},${a})`);
      grad.addColorStop(1, `rgba(${r},${g},${b},0)`);

      ctx.beginPath();
      ctx.arc(sx, sy, radius * 2, 0, Math.PI * 2);
      ctx.fillStyle = grad;
      ctx.fill();
    }

    // 通知截图工具已就绪
    canvas.dataset.ready = '1';

    console.log(`[lucid-3d] Particle demo rendered. activeCount=${count}. Ready for screenshot.`);
  </script>
</body>
</html>
